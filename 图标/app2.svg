<title id="title">Refined HUST history museum icon</title>
<desc id="desc">Refined HUST history museum icon with structural clearances set to sixty-five percent of the original refined version: 3.3475 viewBox units. Roof-to-wall gaps, vertical beam-to-wall gaps and perpendicular beam-to-roof gaps share this width. All five enlarged doors retain their dimensions: widths 24, 19.2 and 15.36 units; heights 43.2, 32.4 and 21.6 units from center outward. Artwork position, colors, ellipse, steel members and rounded corners are preserved. Cutouts are transparent; artwork is exactly mirrored.</desc>

<title id="title">Symmetric gabled building app icon</title>
<desc id="desc">Complete artwork shifted up 28 units, doubling bottom padding from 28 to 56 units on a 329-unit canvas; side padding remains 28 units. Dark red walls are twenty percent shorter, from 106 to 84.8 units. Central trapezoid and side roofs share the same top and bottom boundaries. The central opening is a horizontal ellipse, radii 11.5 and 6.5. A common 3-unit clear gap separates neighboring color blocks. All exposed corners and steel ends are rounded. Red saturation is reduced by two successive ten-percent steps from the color-managed reference.</desc>

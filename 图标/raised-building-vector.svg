    <path d="M164.5 161.2 L194.5 213.1615242270663 V301 H134.5 V213.1615242270663 Z" fill="black"/>
    <path d="M161.901924 135.7 A3 3 0 0 1 167.098076 135.7 L203.098076 198.053829 A3 3 0 0 1 203.5 199.553829 L203.5 297 A4 4 0 0 1 199.5 301 L198.5 301 A4 4 0 0 1 194.5 297 L194.5 213.697423 A2 2 0 0 0 194.232051 212.697423 L166.232051 164.2 A2 2 0 0 0 162.767949 164.2 L134.767949 212.697423 A2 2 0 0 0 134.5 213.697423 L134.5 297 A4 4 0 0 1 130.5 301 L129.5 301 A4 4 0 0 1 125.5 297 L125.5 199.553829 A3 3 0 0 1 125.901924 198.053829 Z" fill="black" stroke="black" stroke-width="6" stroke-linejoin="round"/>
    <g id="left-clearance" fill="none" stroke="black" stroke-width="15" stroke-linecap="round" stroke-linejoin="round"><path d="M52.5 296.5 V211.2 L82.5 175.2 M90.5 296.5 V211.2 L117.5 175.2"/></g>
    <use href="#left-clearance" transform="translate(329 0) scale(-1 1)"/>
  </mask>
</defs>

<g transform="translate(0 -28)">

[package]
name = "campuser"
version = "2.0.0"
description = "CAMPUSER 课程表（Tauri 2 壳）"
authors = ["CAMPUSER"]
edition = "2021"

[lib]
name = "campuser_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-share = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

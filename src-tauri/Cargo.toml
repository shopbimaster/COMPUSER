[package]
name = "campuser"
version = "2.0.0"
description = "CAMPUSER 课程表（Tauri 2 壳）"
authors = ["CAMPUSER"]
edition = "2021"

[lib]
name = "campuser_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[features]
# 生产构建必需：tauri 的 build.rs 以 custom-protocol 是否启用来判定 dev/release
# （dev = !custom_protocol）。绕过 CLI 直接 cargo 构建时若不启用，Android 会走
# dev 代理路径（reqwest 请求 http://tauri.localhost）→ 启动白屏一行报错。
custom-protocol = ["tauri/custom-protocol"]

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-share = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# 教务导入网络代理（rustls 纯 Rust TLS，避免 Android 交叉编译 openssl 依赖）
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "http2"] }

# Android 状态栏图标控制（JNI 调 WindowInsetsController）——版本对齐 tauri 依赖树避免重复编译
[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21.1"
ndk-context = "0.1.1"
